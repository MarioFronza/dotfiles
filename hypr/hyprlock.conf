# Tokyo Night colors, hardcoded (no dynamic theme system).

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1b26ff)
    path = ~/Pictures/wallpaper.png
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(24283bcc)
    outer_color = rgba(7aa2f7ff)
    outline_thickness = 4

    font_family = Adwaita Mono
    font_color = rgba(c0caf5ff)

    placeholder_text = Enter Password
    check_color = rgba(9ece6aff)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
