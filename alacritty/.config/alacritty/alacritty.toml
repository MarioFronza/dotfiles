general.import = ["~/.config/alacritty/tokyo-night.toml"]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "AdwaitaMono Nerd Font" }
bold = { family = "AdwaitaMono Nerd Font" }
italic = { family = "AdwaitaMono Nerd Font" }
size = 16

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
]
